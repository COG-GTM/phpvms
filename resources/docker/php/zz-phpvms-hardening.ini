; Hardening recommended by the PHP team alongside the PHP2Shell fixes
; (CVE-2026-109618 / CVE-2026-109619). This is a mitigation that reduces the
; exposed surface, NOT the fix -- the fix is the PHP 8.5.12 runtime that the
; serversideup/php v5.0.3 base image in Dockerfile.prod ships.
;
; phpVMS does not use PHP's session upload progress tracking (file uploads go
; through Filament/Livewire), so disabling it has no functional impact.
session.upload_progress.enabled = 0
